name: Multi-Agent Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Grants permissions to post automated PR comments

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetches changes between commits for diffing

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Git Diff
        run: |
          # Generate git diff of changes in the pull request
          git diff HEAD~1 > pr_diff.txt
          echo "PR Diff extracted successfully."

      - name: Run Multi-Agent Code Reviewer
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Execute the agent script and redirect Markdown output to file
          python reviewer.py > review_comment.md

      - name: Post PR Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('review_comment.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewBody
            });